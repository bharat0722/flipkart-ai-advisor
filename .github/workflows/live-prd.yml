name: Update live PRD

on:
  push:
    branches: [main]
    paths:
      - 'docs/phase_status.json'
      - 'docs/PRD.md'
      - 'docs/handoffs/**'
      - 'scripts/sync_prd.py'
      - '.github/workflows/live-prd.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-prd-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render and publish the phase table
        run: |
          python3 scripts/sync_prd.py
          if git diff --quiet -- docs/PRD.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/PRD.md
          git commit -m 'Update live PRD phase status'
          git push origin HEAD:main
